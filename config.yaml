# All thresholds live here. Each has a one-line rationale; changes are logged in DECISIONS.md.

data:
  root: data/skillcorner/data          # output of scripts/download_data.sh
  cache: data/cache                    # parquet cache of parsed tracking (gitignored)
  fps: 10                              # SkillCorner tracking frame rate (from README, verified in audit)

losses:
  # Primary source (proposed, awaiting GATE 0): dynamic-events player_possession runs (D-004).
  source: events                       # events | tracking (tracking possession field kept as cross-check only)
  min_sustain_s: 1.0                   # debounce: B must hold possession >= 1 s so deflections/flicks are not losses
  max_null_gap_s: 1.0                  # tracking-field detector only: bridge null gaps <= 1 s (has no effect in practice, see audit)
  require_ball_in_play: true           # losses only while phases of play are contiguous (phases exist only in play)

shape:
  # Components entering D(t) and their weights (equal weights a priori; sensitivity later).
  weights: {line_height: 1.0, depth: 1.0, width: 1.0, cx_ball: 1.0, cy_ball: 1.0, nn_median: 1.0, goal_side: 1.0}

reference:
  settled_after_loss_s: 15.0           # organised-defence frames must be >= 15 s after the team's last loss (brief)
  organised_phases: [low_block, medium_block, high_block]   # phases-of-play out-of-possession labels for a settled block
  n_channels: 3                        # ball lateral channels (equal thirds of pitch width)
  n_depths: 3                          # ball depth thirds (own / middle / attacking third of the defending team)
  shrinkage_k_frames: 600              # prior strength toward league cell = 60 s of organised play (frames are autocorrelated)
  # Spread floors (component units) so near-constant cells cannot produce huge z-scores.
  spread_floor: {line_height: 1.0, depth: 1.0, width: 1.0, cx_ball: 1.0, cy_ball: 1.0, nn_median: 0.5, goal_side: 0.5}
  split_half_min_frames: 300           # a team-cell enters the split-half check only with >= 30 s per half

reorganisation:
  horizon_s: 20.0                      # administrative censoring cap (brief)
  hold_s: 2.0                          # D(t) <= tau must hold this long to count as reorganised (hysteresis)
  tau_quantile: 0.75                   # tau = this quantile of D over the team's own organised frames
  debt_window_s: 15.0                  # reorganisation debt integration window
  decomposition_horizons_s: [3.0, 6.0, 10.0]   # fixed horizons for component contributions (brief)
  ball_speed_window_s: 3.0             # opponent ball speed measured over the first 3 s (brief)
  savgol_window_frames: 7              # Savitzky-Golay window for ball velocity (0.7 s at 10 fps)
  savgol_polyorder: 2

outcomes:
  danger_window_s: 15.0                # dangerous attack conceded within this window after loss
  min_box_frames: 2                    # box entry must last >= 0.2 s (one-frame ball jitter at the box edge is not an entry)
  landmarks_s: [3.0, 6.0]              # landmark times for H2/H4 (3 s primary, 6 s secondary), fixed before outcome analysis

reliability:
  # Regimes (5.6). Placeholders near the audit median; fixed in ANALYSIS_PLAN.md before outcome models.
  frame_min_detected: 0.5              # "detected-only" regime: D undefined when < 50% of the 10 defenders are detected
  episode_min_reliability: 0.6         # "reliable episodes" regime: mean detected fraction over first 10 s >= 0.6

prototype:
  match_id: 2007721                    # D-010: Auckland FC v CC Mariners
  n_examples: 6                        # fastest / slowest / random episodes animated for face validity
  seed: 20261009                       # fixed seed for random example choice and bootstrap
  n_boot: 200                          # match-level bootstrap replicates for CIF bands

confirmatory:                          # ANALYSIS_PLAN.md (frozen 9 Oct 2026)
  n_boot: 2000                         # match-cluster bootstrap resamples for every CI
  n_perm: 5000                         # H1 permutations
  min_events_full_model: 60            # H2 events-per-parameter rule (10 per term)
  primary_horizon_s: 6.0               # H1 and H3 horizon
  alpha: 0.05                          # family-wise, Holm
